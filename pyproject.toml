[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-x402-paywall-mcp"
version = "1.0.3"
description = "Agent x402 Paywall MCP — wraps Coinbase x402 (HTTP 402) so agents pay per-call without Stripe accounts. On-chain settlement via USDC (Base/Polygon/Solana) or Lightning. The plumbing for the agent economy. By MEOK AI Labs."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Nicholas Templeman", email = "nicholas@meok.ai" }]
keywords = ["mcp", "x402", "coinbase", "http-402", "paywall", "usdc", "agent-payments", "on-chain", "lightning", "meok"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
  "Topic :: Internet :: WWW/HTTP",
  "Intended Audience :: Developers",
]
dependencies = ["mcp[cli]>=1.3.0"]

[project.urls]
Homepage = "https://meok.ai/a2a"
Repository = "https://github.com/CSOAI-ORG/agent-x402-paywall-mcp"
Documentation = "https://meok.ai/protocols"

[project.scripts]
agent-x402-paywall-mcp = "server:main"

[tool.setuptools]
py-modules = ["server"]
